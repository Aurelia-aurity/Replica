<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="75mm" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">검색 방식별 근거 구성과 답변 생성</title>
  <desc id="desc">동일 질문과 사용자 확정 기록으로 검색 v1과 v2를 비교한다. v1은 유사도 상위 5개 청크를 근거로 직접 전달한다. v2는 KURE-v1의 L2 정규화 코사인 유사도로 검색하고 질문의 최고 유사도가 0.5459 미만이면 빈 근거를 반환한다. 기준 이상이면 상위 3개 결과로 원기록의 대화 전후 3턴 또는 일기 전문을 복원하고 길이를 조정하여 근거 JSON을 Qwen 2,000토큰 이내로 구성한다. 빈 근거와 복원 근거 모두 같은 근거 제한·말투 결합 프롬프트 및 고정 Qwen3-8B로 답변을 생성한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#454545"/>
    </marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:13.5px;fill:#171717}
      .heading{font-size:14px;font-weight:700}
      .node{fill:#fff;stroke:#454545;stroke-width:1.1}
      .evidence{fill:#ececec;stroke:#454545;stroke-width:1.1}
      .edge{fill:none;stroke:#454545;stroke-width:1.2;marker-end:url(#arrow)}
      .wire{fill:none;stroke:#454545;stroke-width:1.2}
      .rule{fill:none;stroke:#8a8a8a;stroke-width:0.8}
    </style>
  </defs>
  <rect width="760" height="300" fill="#fff"/>

  <!-- Shared question reaches retrieval and the same generator. -->
  <path d="M88 24V8H679V36" class="edge"/>
  <rect x="440" y="0" width="76" height="17" fill="#fff"/>
  <text x="478" y="13" text-anchor="middle">동일 질문</text>
  <rect x="12" y="24" width="154" height="64" class="node"/>
  <text x="89" y="44" text-anchor="middle" class="heading">동일 질문</text>
  <text x="89" y="63" text-anchor="middle" class="heading">사용자 확정 기록</text>
  <text x="89" y="81" text-anchor="middle">원문·검색 청크</text>
  <path d="M166 56H184" class="wire"/>
  <path d="M184 56V48H205" class="edge"/>
  <path d="M184 56V136H205" class="edge"/>
  <circle cx="184" cy="56" r="2.4" fill="#454545"/>

  <!-- v1 directly transfers retrieved chunks as evidence. -->
  <rect x="205" y="24" width="380" height="48" class="evidence"/>
  <text x="395" y="44" text-anchor="middle" class="heading">기존 검색 v1</text>
  <text x="395" y="63" text-anchor="middle">유사도 상위 5개 청크를 근거로 직접 전달</text>
  <path d="M585 48H610" class="edge"/>

  <!-- v2 selects records, makes a query-level decision, then restores context. -->
  <rect x="205" y="106" width="170" height="60" class="node"/>
  <text x="290" y="125" text-anchor="middle" class="heading">개선 검색 v2</text>
  <text x="290" y="143" text-anchor="middle">KURE-v1</text>
  <text x="290" y="160" text-anchor="middle">L2 정규화 코사인</text>
  <path d="M290 166V180" class="edge"/>
  <path d="M290 180L365 215L290 250L215 215Z" class="node"/>
  <text x="290" y="211" text-anchor="middle">질문 최고 유사도</text>
  <text x="290" y="229" text-anchor="middle" class="heading">0.5459</text>

  <path d="M365 215H390V132H415" class="edge"/>
  <rect x="376" y="166" width="30" height="19" fill="#fff"/>
  <text x="391" y="180" text-anchor="middle">미만</text>
  <rect x="415" y="111" width="170" height="42" class="evidence"/>
  <text x="500" y="137" text-anchor="middle" class="heading">빈 근거</text>

  <path d="M290 250V263H415" class="edge"/>
  <text x="370" y="258" text-anchor="middle">이상</text>
  <rect x="415" y="190" width="170" height="86" class="evidence"/>
  <text x="500" y="207" text-anchor="middle" class="heading">상위 3개 → 문맥 복원</text>
  <text x="500" y="224" text-anchor="middle">대화 전후 3턴</text>
  <text x="500" y="241" text-anchor="middle">또는 일기 전문</text>
  <text x="500" y="258" text-anchor="middle">길이 조정 후 근거 JSON</text>
  <text x="500" y="272" text-anchor="middle">≤ 2,000 Qwen 토큰</text>

  <!-- Restoration reads original context, not merely the retrieved chunks. -->
  <path d="M70 88V292H500V276" class="edge"/>
  <rect x="94" y="281" width="183" height="18" fill="#fff"/>
  <text x="185" y="295" text-anchor="middle">원기록에서 복원 문맥 공급</text>

  <!-- Alternative evidence states join before common generation. -->
  <path d="M585 132H597V233H585" class="wire"/>
  <circle cx="597" cy="182" r="2.4" fill="#454545"/>
  <path d="M597 182H610" class="edge"/>
  <rect x="610" y="36" width="138" height="213" class="node"/>
  <text x="679" y="61" text-anchor="middle" class="heading">공통 답변 생성</text>
  <path d="M620 74H738" class="rule"/>
  <text x="679" y="96" text-anchor="middle">동일 결합 프롬프트</text>
  <text x="679" y="117" text-anchor="middle">근거 제한·말투 지시</text>
  <path d="M679 129V149" class="edge"/>
  <text x="679" y="174" text-anchor="middle" class="heading">Qwen3-8B 고정</text>
  <text x="679" y="199" text-anchor="middle">빈 근거에서도 응답</text>
  <path d="M679 211V230" class="edge"/>
  <text x="679" y="243" text-anchor="middle" class="heading">응답</text>
</svg>
