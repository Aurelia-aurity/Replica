name: Notion sync shadow

on:
  workflow_run:
    workflows: ["GitHub → Notion"]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Reviewed full commit SHA, exactly matching this run'
        type: string
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: replica-sync-shadow
  cancel-in-progress: true

jobs:
  shadow:
    if: >-
      github.repository == 'Aurelia-aurity/Replica' &&
      (
        github.event_name == 'workflow_run' ||
        (
          github.event_name == 'workflow_dispatch' &&
          format('{0}', github.actor_id) == vars.PM_GITHUB_USER_ID &&
          github.actor == github.triggering_actor &&
          format('{0}', github.run_attempt) == '1' &&
          inputs.approved_sha == github.sha &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/feat/80-simple-bidirectional-sync')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compute read-only status plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          PROJECT_OWNER_ID: ${{ vars.PROJECT_OWNER_ID }}
          PROJECT_STATUS_FIELD_ID: ${{ vars.PROJECT_STATUS_FIELD_ID }}
          PROJECT_STATUS_OPTIONS: ${{ vars.PROJECT_STATUS_OPTIONS }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          SYNC_SIMPLE_APPLY: 'false'
        run: python3 -B scripts/sync_simple.py --dry-run --report sync-simple-plan.json
      - name: Upload shadow plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-simple-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: sync-simple-plan.json
          if-no-files-found: error
          retention-days: 30
