# Temporary pre-fix reproduction workflow for #129; remove before the PR is ready.
name: AI flake reproduction

on:
  push:
    branches:
      - fix/129-ai-tests-ci-flake
    paths:
      - .github/workflows/ai-flake-repro.yml
      - 'ai/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      REPRO_OS: ${{ matrix.os }}
      REPRO_OUT: repro-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install baseline dependencies
        run: python -m pip install -r backend/requirements-dev.txt numpy==2.2.6
      - name: Verify full-suite collection
        run: |
          mkdir -p "$REPRO_OUT"
          {
            printf 'image_os=%s image_version=%s\n' "${ImageOS:-}" "${ImageVersion:-}"
            python -c 'import locale, platform, sys; print(platform.platform(), platform.machine()); print(sys.version); print("encoding", locale.getencoding(), "utf8_mode", sys.flags.utf8_mode)'
            python -m pip freeze
          } > "$REPRO_OUT/environment.txt"
          python -m pytest ai/tests -q -p no:cacheprovider --collect-only 2>&1 | tee "$REPRO_OUT/collection.log"
      - name: Run fixed pre-fix samples
        run: |
          run_batch() {
            local mode=$1 runs=$2 selection=$3
            local i run_id rc failures=0
            for ((i=1; i<=runs; i++)); do
              printf -v run_id '%s-%02d' "$mode" "$i"
              if python -m pytest "$selection" -q -p no:cacheprovider > "$REPRO_OUT/$run_id.log" 2>&1; then
                rc=0
                rm "$REPRO_OUT/$run_id.log"
              else
                rc=$?
                failures=$((failures + 1))
              fi
              printf '%s\t%s\n' "$run_id" "$rc" | tee -a "$REPRO_OUT/exit-codes.tsv"
            done
            BATCH_FAILURES=$failures
          }

          printf 'run\texit_code\n' > "$REPRO_OUT/exit-codes.tsv"
          run_batch full 20 ai/tests
          full_fail=$BATCH_FAILURES
          run_batch isolated 10 ai/tests/test_smoke_persona.py
          printf 'SUMMARY os=%s full_fail=%s/20 isolated_fail=%s/10\n' \
            "$REPRO_OS" "$full_fail" "$BATCH_FAILURES" | tee "$REPRO_OUT/summary.txt"
      - name: Upload reproduction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-flake-repro-${{ matrix.os }}
          path: repro-results/
          if-no-files-found: error
