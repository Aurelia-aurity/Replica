name: GitHub → Notion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '읽기 전용 사전검사 (비활성 상태에서도 실행 가능)'
        type: boolean
        required: true
        default: true
      diagnose_date_readback:
        description: 'dry-run에서 Issue #1 날짜 응답의 비밀 없는 형식 진단'
        type: boolean
        required: false
        default: false
      resolve_issue_numbers:
        description: 'PM이 현재 Project 값을 승인한 보류 이슈 번호 (쉼표 구분)'
        type: string
        required: false
        default: ''
      approved_sha:
        description: '검토한 전체 40자리 commit SHA (실행 SHA와 정확히 일치해야 함)'
        type: string
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, deleted, transferred]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft, assigned, unassigned, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: replica-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'Aurelia-aurity/Replica' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          format('{0}', github.actor_id) == vars.PM_GITHUB_USER_ID &&
          github.actor == github.triggering_actor &&
          format('{0}', github.run_attempt) == '1' &&
          inputs.approved_sha == github.sha &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/fix/17-project-add-readback')
        ) ||
        (
          github.event_name != 'workflow_dispatch' &&
          (github.event_name != 'pull_request_target' || github.base_ref == 'main') &&
          vars.NOTION_SYNC_ENABLED == 'true'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # pull_request_target: use ONLY trusted main code, never a PR/fork ref or event-provided command.
      - name: Validate exact manual ref
        if: github.event_name == 'workflow_dispatch'
        env:
          SYNC_DISPATCH_REF: ${{ github.ref }}
        run: |
          case "$SYNC_DISPATCH_REF" in
            refs/heads/main|refs/heads/fix/17-project-add-readback)
              ;;
            *)
              echo "Manual workflow ref is not allowed" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify sync implementation
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Sync current GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          PROJECT_OWNER_ID: ${{ vars.PROJECT_OWNER_ID }}
          PROJECT_STATUS_FIELD_ID: ${{ vars.PROJECT_STATUS_FIELD_ID }}
          PROJECT_STATUS_OPTIONS: ${{ vars.PROJECT_STATUS_OPTIONS }}
          PM_GITHUB_USER_ID: ${{ vars.PM_GITHUB_USER_ID }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_CONTROL_PAGE_ID: ${{ vars.NOTION_CONTROL_PAGE_ID }}
          NOTION_SYNC_ENABLED: ${{ github.event_name == 'workflow_dispatch' && 'true' || vars.NOTION_SYNC_ENABLED }}
          SYNC_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SYNC_DIAGNOSE_DATE_READBACK: ${{ inputs.diagnose_date_readback && 'true' || 'false' }}
          SYNC_RESOLVE_ISSUES: ${{ inputs.resolve_issue_numbers }}
        run: |
          python3 -B - <<'PY'
          import os
          import subprocess
          import sys

          diagnose_date = os.environ.get("SYNC_DIAGNOSE_DATE_READBACK") == "true"
          if diagnose_date and os.environ.get("SYNC_DRY_RUN") != "true":
              raise SystemExit("--diagnose-date-readback requires --dry-run")
          args = ["--notification-report", "notion-notification-report.json"]
          if os.environ.get("SYNC_DRY_RUN") == "true":
              args.append("--dry-run")
          if os.environ.get("SYNC_RESOLVE_ISSUES"):
              args.extend(["--resolve-issue-numbers", os.environ["SYNC_RESOLVE_ISSUES"]])
          if diagnose_date:
              args.append("--diagnose-date-readback")
          subprocess.run([sys.executable, "-B", "scripts/notion_sync.py", *args], check=True)
          PY
      - name: Publish notification result
        if: always() && hashFiles('notion-notification-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notion-notification-${{ github.run_id }}-${{ github.run_attempt }}
          path: notion-notification-report.json
          if-no-files-found: error
          retention-days: 30
